# ============================================================
# HugEngine CI — Windows 构建 + shader 绑定契约对账 + 单元测试
#
# 与本地门禁脚本 Tools/ci/ci.ps1 走同一条命令链，避免"本地绿、CI 红"。
# 依赖：
#   · Vulkan SDK（提供 slangc / spirv-dis）—— 用 install-vulkan-sdk action
#   · Visual Studio（Windows runner 自带，含 fxc / dxc 运行库）
#   · Python 3（Tools/shader/binding_audit.py 用）
#   · D3D12 Agility SDK —— configure 阶段自动从 nuget.org 下载（cmake/AgilitySDK.cmake）
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Windows / ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Debug 跳过被 HE_ASSERT 中止的用例，Release 才覆盖它们（见 Tests/TestSurfaceCache.cpp）
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Vulkan SDK
        uses: jurplel/install-vulkan-sdk@v1
        with:
          version: "1.4.341.1"
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: >
          cmake -S . -B Build
          -DHUGENGINE_BUILD_TESTS=ON
          -DHUGENGINE_BUILD_SAMPLES=OFF
          -DHUGENGINE_BUILD_EDITOR=OFF
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build Build --config ${{ matrix.config }} -- /m

      # 鸿蒙分支的编译自检：stub 头 + HE_PLATFORM_OHOS_STUBCHECK，把 Platforms/OHOS 与
      # Engine/Core/Platform/WindowOHOS.cpp 等鸿蒙专用代码在 Windows 上编一遍。
      - name: OHOS 编译自检（stub 头）
        if: matrix.config == 'Debug'
        run: cmake --build Build --config Debug --target OhosStubCheck

      # 契约对账：146 个入口 × 3 后端（Vulkan / DX12 / DX11）各跑一次 slangc 反射，
      # 与 ShaderTypes/GPUBindings.slang 的 kGPUBinding_* 以及 RHI/Types.h 的镜像比对。
      # 只在 Debug 下跑一次（与配置无关，省一半时间）。
      - name: Shader binding audit
        if: matrix.config == 'Debug'
        run: cmake --build Build --config Debug --target AuditShaderBindings

      # T14：离线工具冒烟 —— 用入库测试资产跑一遍 glTF → .nanite v2，
      # `--verify` 会读回文件并与内存构建产物逐字节比对（工具可运行 + 格式往返 + 字节一致）。
      # 构建器确定性由单测覆盖（同一输入两次构建字节相等）。
      - name: Nanite 离线工具冒烟（入库测试资产）
        run: .\Build\bin\${{ matrix.config }}\MeshPreprocess.exe Tests\Assets\MiniTriangle.gltf Build\ProcessedSmoke --stats --verify

      - name: Unit tests
        run: .\Build\bin\${{ matrix.config }}\HugEngineTests.exe
